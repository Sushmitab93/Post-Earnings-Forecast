name: Publish report to GitHub Pages

# Renders the Quarto report and publishes it at
# https://sushmitab93.github.io/Post-Earnings-Forecast/
on:
  push:
    branches: [main]
    paths:
      - "src/report/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.42

      - name: Install render deps
        run: pip install -r src/report/requirements-report.txt

      - name: Render report
        run: quarto render src/report/my_report.qmd --to html --output-dir "$GITHUB_WORKSPACE/src/out"
        env:
          QUARTO_PYTHON: python

      - name: Prepare site
        run: |
          mkdir -p site
          cp src/out/my_report.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
